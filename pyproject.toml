[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "0.1.0"
description = "Mock-first skeleton for a local, evidence-backed documentation assistant"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "markdown-it-py>=4.2,<5",
    "pydantic>=2.11,<3",
    "pypdf>=6.21.4,<7",
    "python-dotenv>=1,<2",
    "streamlit>=1.45,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
